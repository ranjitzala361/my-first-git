<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ZALA KING TURBO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;text-align:center;overflow:hidden}
h1{color:gold;text-shadow:0 0 10px gold;margin:10px 0;font-size:28px}
#top{display:flex;justify-content:space-around;font-size:20px;color:gold;font-weight:bold}
canvas{background:#222;display:block;margin:5px auto;border:3px solid gold;border-radius:10px}
#ctrl{display:flex;justify-content:center;gap:20px;margin-top:8px}
.btn{width:130px;height:70px;background:#FFD700;color:#000;font-size:22px;font-weight:900;border:none;border-radius:15px;box-shadow:0 5px 0 #b89600}
.btn:active{transform:translateY(4px);box-shadow:none}
#over{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10}
#over h2{font-size:50px;color:red}
</style>
</head>
<body>
<h1>👑 ZALA KING TURBO 👑</h1>
<div id="top"><div id="score">SCORE: 0</div><div id="speed">SPEED: 0</div></div>
<canvas id="c" width="360" height="540"></canvas>
<div id="ctrl">
<button class="btn" id="left">◀ LEFT</button>
<button class="btn" id="right">RIGHT ▶</button>
</div>
<div id="over">
<h2>💥 CRASH! 💥</h2>
<p id="final" style="font-size:28px;margin:15px;color:gold"></p>
<button onclick="location.reload()" style="padding:15px 40px;font-size:22px;background:gold;border:none;border-radius:10px;font-weight:bold">RESTART RAJA</button>
</div>
<script>
let cv=document.getElementById('c'),ctx=cv.getContext('2d');
let x=160,y=440,w=42,h=80;
let score=0,speed=6,game=true;
let keys={};
let enemies=[
{x:70,y:-200,w:42,h:80,c:'#ff0033'},
{x:160,y:-500,w:42,h:80,c:'#00ccff'},
{x:250,y:-800,w:42,h:80,c:'#00ff66'}
];
let lineY=0;

function drawRoad(){
ctx.fillStyle="#333";ctx.fillRect(0,0,360,540);
ctx.fillStyle="#111";ctx.fillRect(50,0,260,540);
ctx.fillStyle="white";
for(let i=-100;i<700;i+=60){
ctx.fillRect(178, i+lineY, 6, 35);
}
ctx.fillStyle="#FFD700";ctx.fillRect(48,0,4,540);ctx.fillRect(308,0,4,540);
lineY+=speed; if(lineY>60)lineY=0;
}
function drawCar(px,py,pw,ph,color,king){
ctx.fillStyle=color;
ctx.fillRect(px,py,pw,ph);
ctx.fillStyle="#000";ctx.fillRect(px+5,py+12,pw-10,15);ctx.fillRect(px+5,py+ph-25,pw-10,15);
ctx.fillStyle="#fff";ctx.fillRect(px+2,py+2,8,8);ctx.fillRect(px+pw-10,py+2,8,8);
if(king){ctx.font="20px Arial";ctx.fillText("👑",px+10,py+40)}
}
function loop(){
if(!game)return;
drawRoad();
if(keys['left']||keys['a'])x-=8;
if(keys['right']||keys['d'])x+=8;
if(x<50)x=50; if(x>308-w)x=308-w;
drawCar(x,y,w,h,'#FFD700',true);

enemies.forEach(e=>{
e.y+=speed;
if(e.y>600){e.y=-200-Math.random()*600;e.x=50+Math.random()*216|0;score+=10;if(speed<18)speed+=0.2;}
drawCar(e.x,e.y,e.w,e.h,e.c,false);
if(e.x<x+w && e.x+e.w>x && e.y<y+h && e.y+e.h>y){
game=false;document.getElementById('over').style.display='flex';
document.getElementById('final').innerText='SCORE: '+score+' | SPEED: '+Math.floor(speed*10);
if(navigator.vibrate)navigator.vibrate(300);
}
});
document.getElementById('score').innerText='SCORE: '+score;
document.getElementById('speed').innerText='SPEED: '+Math.floor(speed*10);
requestAnimationFrame(loop);
}
loop();
document.getElementById('left').addEventListener('touchstart',e=>{keys['left']=true;e.preventDefault()});
document.getElementById('left').addEventListener('touchend',()=>keys['left']=false);
document.getElementById('right').addEventListener('touchstart',e=>{keys['right']=true;e.preventDefault()});
document.getElementById('right').addEventListener('touchend',()=>keys['right']=false);
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let sx=0;cv.addEventListener('touchstart',e=>sx=e.touches[0].clientX);
cv.addEventListener('touchmove',e=>{let dx=e.touches[0].clientX-sx;if(dx<-15)x-=8;if(dx>15)x+=8;sx=e.touches[0].clientX;e.preventDefault()},{passive:false});
</script>
</body>
</html>
