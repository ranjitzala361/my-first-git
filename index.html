<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZALA KING RACE</title><style>body{margin:0;background:#111;color:#fff;text-align:center;font-family:Arial}h1{color:gold}canvas{background:#222;border:3px solid gold;display:block;margin:10px auto}#s{color:gold;font-size:28px}</style></head><body><h1>👑 ZALA KING RACE 👑</h1><div id="s">SCORE: 0</div><canvas id="c" width="300" height="500"></canvas><p>TAP LEFT / RIGHT TO MOVE</p><script>let c=document.getElementById('c'),ctx=c.getContext('2d'),x=130,sc=0,live=true,obs=[{x:90,y:-100},{x:170,y:-350}];function draw(){if(!live)return;ctx.clearRect(0,0,300,500);ctx.fillStyle="#444";ctx.fillRect(60,0,180,500);ctx.fillStyle="gold";ctx.fillRect(x,420,40,50);ctx.fillStyle="red";obs.forEach(o=>{o.y+=6;ctx.fillRect(o.x,o.y,40,50);if(o.y>410&&o.x<x+40&&o.x+40>x){live=false;alert('GAME OVER! Score: '+sc);location.reload()}if(o.y>550){o.y=-100;o.x=60+Math.random()*140|0;sc++;document.getElementById('s').innerText='SCORE: '+sc}});requestAnimationFrame(draw)}draw();document.addEventListener('touchstart',e=>{if(e.touches[0].clientX<150){if(x>60)x-=30}else{if(x<200)x+=30}})</script></body></html>
